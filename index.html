<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>kalsh · paper trading progress</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --text: #2b2b29; --text-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(43,43,41,.12);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --good: #0ca30c; --warning: #fab219; --up: #006300; --down: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --text: #ededea; --text-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --up: #0ca30c; --down: #e66767;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 20px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
h2 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
.sub { color: var(--text-2); font-size: 13px; margin: 0 0 10px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.ok .dot { background: var(--good); } .stale .dot { background: var(--warning); }
.spacer { flex: 1; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.tile .label { color: var(--text-2); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 600; line-height: 1.2; }
.tile .note { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; margin-bottom: 12px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; touch-action: pan-y; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); white-space: nowrap; display: none; }
.tip b { font-weight: 600; } .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.empty { color: var(--muted); font-size: 13px; padding: 28px 0; text-align: center; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--text-2); font-weight: 500; font-size: 12px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; padding-left: 12px; }
tr:last-child td { border-bottom: 0; }
.stack > .card { margin-bottom: 12px; }
footer { color: var(--muted); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>kalsh</h1>
    <span class="sub" style="margin:0">paper trading progress</span>
    <span class="spacer"></span>
    <span id="env" class="badge"></span>
    <span id="status" class="badge"><span class="dot"></span><span>loading…</span></span>
  </header>
  <div id="app"></div>
  <footer>Paper trades on the Kalshi demo exchange. No real money. Scans run every 15 minutes on a laptop, so gaps mean it was asleep. Data refreshes hourly.</footer>
</main>
<script>
"use strict";
const SVG = "http://www.w3.org/2000/svg";
const COLORS = ["--s1", "--s2", "--s3", "--s4"];

// DOM builder: children go in as text nodes, never parsed as HTML (tickers come from an external API).
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) k === "style" ? (e.style.cssText = v) : e.setAttribute(k, v);
  e.append(...kids.filter(k => k != null));
  return e;
}
function s(tag, attrs) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  return e;
}
const fmtInt = n => Math.round(n).toLocaleString();
const fmtUsd = n => (Math.round(n * 100) < 0 ? "-" : "") + "$" + Math.abs(n).toFixed(2);
const fmtPrice = n => n == null ? "—" : "$" + n.toFixed(2);
const fmtTime = t => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
function ago(t) {
  const m = Math.max(0, Math.round((Date.now() - new Date(t)) / 60000));
  return m < 60 ? m + " min ago" : m < 2880 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago";
}
function niceStep(range, n) {
  const raw = range / n, p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}

function tile(label, value, note) {
  return h("div", { class: "card tile" }, h("div", { class: "label" }, label), h("div", { class: "value" }, value), h("div", { class: "note" }, note || " "));
}
function table(cols, rows, empty) {
  if (!rows.length) return h("div", { class: "empty" }, empty);
  const t = h("table", null,
    h("thead", null, h("tr", null, ...cols.map(c => h("th", c.num ? { class: "n" } : null, c.label)))),
    h("tbody", null, ...rows.map(r => h("tr", null, ...cols.map(c => h("td", c.num ? { class: "n" } : null, String(c.get(r))))))));
  return h("div", { class: "scroll" }, t);
}
function card(title, sub, ...body) {
  return h("section", { class: "card" }, h("h2", null, title), h("p", { class: "sub" }, sub), ...body);
}

// Line chart: time on x, one shared y axis, crosshair + tooltip. series = [{name, color, points: [{t, v}]}]
function lineChart(series, opts) {
  const box = h("div", { class: "chart" });
  const pts = series.flatMap(x => x.points);
  if (!pts.length || (opts.emptyIfZero && pts.every(p => !p.v))) { box.append(h("div", { class: "empty" }, opts.empty)); return box; }
  if (series.length > 1) box.append(h("div", { class: "legend" }, ...series.map(x => h("span", null, h("i", { style: `background:var(${x.color})` }), x.name))));
  const tip = h("div", { class: "tip" });
  const draw = () => {
    box.querySelector("svg")?.remove();
    const W = Math.max(280, box.clientWidth), H = 190, R = 14, T = 10, B = 24;
    let t0 = Math.min(...pts.map(p => p.t)), t1 = Math.max(...pts.map(p => p.t));
    if (t0 === t1) { t0 -= 9e5; t1 += 9e5; }
    let lo = Math.min(0, ...pts.map(p => p.v)), hi = Math.max(opts.integer ? 1 : 0.01, ...pts.map(p => p.v));
    let step = niceStep(hi - lo, 4);
    if (opts.integer) step = Math.max(1, Math.round(step));
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const L = 12 + 6.5 * Math.max(opts.fmt(lo).length, opts.fmt(hi).length);  // room for the widest tick label
    const X = t => L + (t - t0) / (t1 - t0) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": opts.label });
    for (let v = lo; v <= hi + step / 2; v += step) {
      svg.append(s("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      const tx = s("text", { x: L - 8, y: Y(v) + 4, "text-anchor": "end" }); tx.textContent = opts.fmt(v); svg.append(tx);
    }
    const nx = W < 480 ? 3 : 5, day = t1 - t0 > 36 * 36e5;
    for (let i = 0; i < nx; i++) {
      const t = t0 + (t1 - t0) * i / (nx - 1);
      const tx = s("text", { x: X(t), y: H - 6, "text-anchor": i === 0 ? "start" : i === nx - 1 ? "end" : "middle" });
      tx.textContent = new Date(t).toLocaleString([], day ? { month: "short", day: "numeric" } : { hour: "2-digit", minute: "2-digit" });
      svg.append(tx);
    }
    for (const x of series) {
      if (!x.points.length) continue;
      const d = x.points.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1)).join("");
      const last = x.points[x.points.length - 1];
      if (series.length === 1) svg.append(s("path", { d: `${d}L${X(last.t).toFixed(1)} ${Y(0)}L${X(x.points[0].t).toFixed(1)} ${Y(0)}Z`, fill: `var(${x.color})`, opacity: .1 }));
      svg.append(s("path", { d, fill: "none", stroke: `var(${x.color})`, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      svg.append(s("circle", { cx: X(last.t), cy: Y(last.v), r: 4, fill: `var(${x.color})`, stroke: "var(--surface)", "stroke-width": 2 }));
    }
    const hair = s("line", { y1: T, y2: H - B, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
    const hit = s("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" });
    svg.append(hair, hit);
    const times = [...new Set(pts.map(p => p.t))].sort((a, b) => a - b);
    hit.addEventListener("pointermove", e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
      const t = times.reduce((a, b) => Math.abs(X(b) - px) < Math.abs(X(a) - px) ? b : a);
      hair.setAttribute("x1", X(t)); hair.setAttribute("x2", X(t)); hair.setAttribute("visibility", "visible");
      tip.replaceChildren(h("div", { style: "color:var(--text-2)" }, fmtTime(t)), ...series.map(x => {
        const p = x.points.find(p => p.t === t);
        return p && h("div", null, h("i", { style: `background:var(${x.color})` }), x.name + " ", h("b", null, opts.fmt(p.v)));
      }));
      tip.style.display = "block";
      const left = X(t) * r.width / W, flip = left > r.width / 2;
      tip.style.left = (flip ? left - tip.offsetWidth - 10 : left + 10) + "px";
      tip.style.top = (svg.offsetTop + T) + "px";
    });
    hit.addEventListener("pointerleave", () => { hair.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
    box.insertBefore(svg, tip);
  };
  box.append(tip);
  new ResizeObserver(draw).observe(box);
  return box;
}

function render(d) {
  const app = document.getElementById("app"), runs = d.runs, last = runs[runs.length - 1], tot = d.totals;
  const st = document.getElementById("status");
  if (tot.last_run) {
    const stale = Date.now() - new Date(tot.last_run) > 60 * 6e4 + 15 * 6e4;
    st.className = "badge " + (stale ? "stale" : "ok");
    st.lastChild.textContent = (stale ? "Stale · last scan " : "Scanning · last scan ") + ago(tot.last_run);
    st.title = new Date(tot.last_run).toLocaleString();
  } else st.lastChild.textContent = "No scans yet";
  if (last) document.getElementById("env").textContent = last.env;
  else document.getElementById("env").remove();

  const pnl = d.pnl.reduce((a, p) => a + p.realized + p.unrealized, 0);
  const tiles = h("div", { class: "tiles" },
    tile("Scans run", fmtInt(tot.runs), tot.first_run ? "since " + fmtTime(tot.first_run) : ""),
    tile("Markets per scan", last ? fmtInt(last.markets) : "—", "latest scan"),
    tile("Two-sided books", last ? fmtInt(last.two_sided) : "—", last ? `of ${fmtInt(last.markets)} markets` : ""),
    tile("Signals", fmtInt(tot.signals), "all time"),
    tile("Paper fills", fmtInt(tot.fills), "all time"),
    tile("Paper P&L", tot.fills ? fmtUsd(pnl) : "—", tot.fills ? "realized + unrealized" : "no fills yet"));

  const T = r => +new Date(r.ts);
  const health = card("Two-sided books per scan", `Markets with both a bid and an ask. Strategies can only trade these. Last ${d.days} days.`,
    lineChart([{ name: "Two-sided", color: "--s1", points: runs.map(r => ({ t: T(r), v: r.two_sided })) }],
      { integer: true, fmt: fmtInt, label: "Two-sided books per scan", empty: "No scans yet." }));
  const activity = card("Signals and fills per scan", "What the strategies found, and what the paper ledger filled.",
    lineChart([{ name: "Signals", color: "--s1", points: runs.map(r => ({ t: T(r), v: r.signals })) },
               { name: "Fills", color: "--s2", points: runs.map(r => ({ t: T(r), v: r.fills })) }],
      { integer: true, fmt: fmtInt, label: "Signals and fills per scan", emptyIfZero: true,
        empty: "No signals yet. The demo book is thin, so the strategies have nothing to act on." }));
  const strategies = [...new Set([...d.pnl.map(p => p.strategy), ...d.unrealized_series.map(p => p.strategy)])].sort();
  const upnl = card("Unrealized P&L by strategy", "Open positions marked to the snapshot mid, per scan.",
    lineChart(strategies.slice(0, 4).map((name, i) => ({ name, color: COLORS[i],
        points: d.unrealized_series.filter(p => p.strategy === name).map(p => ({ t: T(p), v: p.unrealized })) })),
      { fmt: fmtUsd, label: "Unrealized P&L by strategy", empty: "No open positions yet." }));

  const order = [
    { label: "Time", get: r => fmtTime(r.ts) }, { label: "Strategy", get: r => r.strategy }, { label: "Ticker", get: r => r.ticker },
    { label: "Side", get: r => r.side }, { label: "Action", get: r => r.action },
    { label: "Price", num: 1, get: r => fmtPrice(r.price) }, { label: "Count", num: 1, get: r => fmtInt(r.count) }];
  const tables = h("div", { class: "stack" },
    card("P&L by strategy", "Paper fills only: no fees, no settlement payout yet.", table([
      { label: "Strategy", get: r => r.strategy }, { label: "Realized", num: 1, get: r => fmtUsd(r.realized) },
      { label: "Unrealized", num: 1, get: r => fmtUsd(r.unrealized) }, { label: "Total", num: 1, get: r => fmtUsd(r.realized + r.unrealized) },
      { label: "Open", num: 1, get: r => fmtInt(r.open) }], d.pnl, "No fills yet.")),
    card("Open positions", "What the paper ledger currently holds.", table([
      { label: "Strategy", get: r => r.strategy }, { label: "Ticker", get: r => r.ticker }, { label: "Side", get: r => r.side },
      { label: "Count", num: 1, get: r => fmtInt(r.count) }, { label: "Avg price", num: 1, get: r => fmtPrice(r.avg_price) }], d.positions, "No open positions.")),
    card("Resting orders", "Take-profit sells waiting for the book to reach their price.", table(order, d.open_orders, "No resting orders.")),
    card("Recent fills", "Latest 50.", table(order, d.fills, "No fills yet.")),
    card("Recent signals", "Latest 50.", table(order, d.signals, "No signals yet.")),
    card("Recent scans", "Latest 20. The numbers behind the charts above.", table([
      { label: "Time", get: r => fmtTime(r.ts) }, { label: "Markets", num: 1, get: r => fmtInt(r.markets) },
      { label: "Two-sided", num: 1, get: r => fmtInt(r.two_sided) }, { label: "Max 24h volume", num: 1, get: r => fmtInt(r.max_volume_24h) },
      { label: "Signals", num: 1, get: r => fmtInt(r.signals) }, { label: "Fills", num: 1, get: r => fmtInt(r.fills) }],
      runs.slice(-20).reverse(), "No scans yet.")));

  app.replaceChildren(tiles, h("div", { class: "grid2" }, health, activity), h("div", { class: "stack" }, upnl), tables);
}

fetch("data.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(render).catch(e => {
  document.getElementById("status").lastChild.textContent = "Could not load data";
  document.getElementById("app").replaceChildren(h("div", { class: "card empty" }, "Could not load data.json (" + e.message + ")."));
});
</script>
</body>
</html>
